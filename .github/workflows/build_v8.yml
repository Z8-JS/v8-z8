name: Build V8 Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-v8-desktop:
    name: Build V8 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-latest]

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Depot Tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cd C:\depot_tools
          ./gclient.bat

      - name: Install Depot Tools (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          gclient --version

      - name: Fetch V8 Source
        shell: bash
        run: |
          mkdir v8_build
          cd v8_build
          export DEPOT_TOOLS_UPDATE=0
          fetch --no-history v8
          cd v8
          gclient sync --no-history --shallow

      - name: Patch V8 Source (Windows)
        if: runner.os == 'Windows'
        working-directory: v8_build/v8
        shell: powershell
        run: |
          $backing_store = "src/objects/backing-store.cc"
          if (Test-Path $backing_store) {
            (Get-Content $backing_store) -replace 'fn, internal::AllocationType::kOld', '[&](){ return fn(); }, internal::AllocationType::kOld' | Set-Content $backing_store
            Write-Host "✅ Patched backing-store.cc"
          }

      - name: Configure Build
        working-directory: v8_build/v8
        shell: bash
        run: |
          mkdir -p out.gn/x64.release

          # Default GN Args: Use V8's internal libc++ and disable experimental modules for stability
          GN_ARGS="is_debug=false target_cpu=\"x64\" is_component_build=false v8_monolithic=true v8_use_external_startup_data=false is_clang=true use_custom_libcxx=true use_libcxx_modules=false v8_enable_pointer_compression=true v8_enable_sandbox=true symbol_level=0 v8_enable_v8_checks=false treat_warnings_as_errors=false v8_enable_web_assembly=true v8_enable_google_benchmark=false v8_enable_i18n_support=true"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            GN_ARGS="$GN_ARGS use_lld=true"
          fi

          echo "$GN_ARGS" > out.gn/x64.release/args.gn
          gn gen out.gn/x64.release

      - name: Build V8 Monolith
        working-directory: v8_build/v8
        run: ninja -C out.gn/x64.release v8_monolith

      - name: Upload V8 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v8_monolith_${{ matrix.os }}_x64
          path: |
            v8_build/v8/out.gn/x64.release/obj/v8_monolith.*
            v8_build/v8/out.gn/x64.release/icudtl.dat
            v8_build/v8/include

  build-v8-freebsd:
    name: Build V8 on FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch V8 Source (on Ubuntu Host)
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          export PATH="$HOME/depot_tools:$PATH"
          gclient --version
          export DEPOT_TOOLS_UPDATE=0
          mkdir v8_build && cd v8_build
          fetch --no-history v8
          cd v8
          gclient sync --no-history --shallow

      - name: Build V8 in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git python3 py311-setuptools ninja gn gperf bash bison clang
          run: |
            cd v8_build/v8

            # Configure GN with system tools
            mkdir -p out.gn/x64.release
            echo 'is_debug=false target_cpu="x64" is_component_build=false v8_monolithic=true v8_use_external_startup_data=false is_clang=true use_custom_libcxx=false use_libcxx_modules=false v8_enable_pointer_compression=true v8_enable_sandbox=true symbol_level=0 v8_enable_i18n_support=true clang_base_path="/usr" clang_use_chrome_plugins=false' > out.gn/x64.release/args.gn

            # Use system GN
            gn gen out.gn/x64.release

            # Build
            ninja -C out.gn/x64.release v8_monolith

      - name: Upload Artifacts (FreeBSD)
        uses: actions/upload-artifact@v4
        with:
          name: v8_monolith_freebsd_x64
          path: |
            v8_build/v8/out.gn/x64.release/obj/v8_monolith.a
            v8_build/v8/out.gn/x64.release/icudtl.dat
            v8_build/v8/include
