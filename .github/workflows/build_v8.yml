name: Build V8 Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-v8:
    name: Build V8 on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
            target_cpu: x64
          - name: Linux
            os: ubuntu-22.04
            target_cpu: x64

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Depot Tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cd C:\depot_tools
          ./gclient.bat

      - name: Install Depot Tools (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          gclient --version

      - name: Fetch V8 Source
        shell: bash
        run: |
          mkdir v8_build
          cd v8_build
          export DEPOT_TOOLS_UPDATE=0
          fetch --no-history v8
          cd v8
          git fetch origin refs/tags/14.7.13:refs/tags/14.7.13 --depth=1
          git checkout 14.7.13
          gclient sync --no-history --shallow --force

      - name: Patch V8 Source (Windows)
        if: runner.os == 'Windows'
        working-directory: v8_build/v8
        shell: powershell
        run: |
          $backing_store = "src/objects/backing-store.cc"
          if (Test-Path $backing_store) {
            (Get-Content $backing_store) -replace 'fn, internal::AllocationType::kOld', '[&](){ return fn(); }, internal::AllocationType::kOld' | Set-Content $backing_store
            Write-Host "✅ Patched backing-store.cc"
          }

      - name: Configure Build
        working-directory: v8_build/v8
        shell: bash
        run: |
          BUILD_DIR="out.gn/${{ matrix.config.target_cpu }}.release"
          mkdir -p "$BUILD_DIR"

          # Common Args
          echo 'is_debug = false' > "$BUILD_DIR/args.gn"
          echo 'target_cpu = "${{ matrix.config.target_cpu }}"' >> "$BUILD_DIR/args.gn"
          echo 'is_component_build = false' >> "$BUILD_DIR/args.gn"
          echo 'v8_monolithic = true' >> "$BUILD_DIR/args.gn"
          echo 'v8_use_external_startup_data = false' >> "$BUILD_DIR/args.gn"
          echo 'v8_enable_pointer_compression = true' >> "$BUILD_DIR/args.gn"
          echo 'symbol_level = 0' >> "$BUILD_DIR/args.gn"
          echo 'v8_enable_v8_checks = false' >> "$BUILD_DIR/args.gn"
          echo 'treat_warnings_as_errors = false' >> "$BUILD_DIR/args.gn"
          echo 'v8_enable_web_assembly = true' >> "$BUILD_DIR/args.gn"
          echo 'v8_enable_google_benchmark = false' >> "$BUILD_DIR/args.gn"
          echo 'v8_enable_i18n_support = true' >> "$BUILD_DIR/args.gn"
          echo 'use_libcxx_modules = false' >> "$BUILD_DIR/args.gn"
          echo 'build_with_chromium = false' >> "$BUILD_DIR/args.gn"

          if [[ "${{ matrix.config.name }}" == "Windows" ]]; then
            # Windows specific: Use Clang-cl with system STL for MSVC compatibility
            echo 'is_clang = true' >> "$BUILD_DIR/args.gn"
            echo 'use_custom_libcxx = false' >> "$BUILD_DIR/args.gn"
            echo 'v8_enable_sandbox = false' >> "$BUILD_DIR/args.gn"
            echo 'use_partition_alloc = false' >> "$BUILD_DIR/args.gn"
            echo 'use_lld = true' >> "$BUILD_DIR/args.gn"
            echo 'clang_use_chrome_plugins = false' >> "$BUILD_DIR/args.gn"
          else
            # Linux specific: Use Clang (default), keep sandbox enabled
            echo 'is_clang = true' >> "$BUILD_DIR/args.gn"
            echo 'use_custom_libcxx = true' >> "$BUILD_DIR/args.gn"
            echo 'v8_enable_sandbox = false' >> "$BUILD_DIR/args.gn"
            echo 'use_partition_alloc = false' >> "$BUILD_DIR/args.gn"
          fi

          cat "$BUILD_DIR/args.gn"
          gn gen "$BUILD_DIR"

      - name: Build V8 Monolith
        working-directory: v8_build/v8
        run: ninja -C out.gn/${{ matrix.config.target_cpu }}.release v8_monolith

      - name: Upload V8 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v8_monolith_${{ matrix.config.name }}_${{ matrix.config.target_cpu }}
          path: |
            v8_build/v8/out.gn/${{ matrix.config.target_cpu }}.release/obj/v8_monolith.*
            v8_build/v8/out.gn/${{ matrix.config.target_cpu }}.release/icudtl.dat
            v8_build/v8/include
