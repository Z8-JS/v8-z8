name: Build V8 Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-v8:
    name: Build V8 on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
            target_cpu: x64
          - name: Linux
            os: ubuntu-22.04
            target_cpu: x64
          - name: macOS
            os: macos-14
            target_cpu: arm64

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Depot Tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cd C:\depot_tools
          ./gclient.bat

      - name: Install Depot Tools (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          gclient --version

      - name: Fetch V8 Source
        shell: bash
        run: |
          mkdir v8_build
          cd v8_build
          export DEPOT_TOOLS_UPDATE=0
          fetch --no-history v8
          cd v8
          gclient sync --no-history --shallow

      - name: Select Xcode 15 (macOS)
        if: runner.os == 'macOS'
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.3.app || sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | head -1)"
          xcodebuild -version

      - name: Patch V8 Source (Windows)
        if: runner.os == 'Windows'
        working-directory: v8_build/v8
        shell: powershell
        run: |
          $backing_store = "src/objects/backing-store.cc"
          if (Test-Path $backing_store) {
            (Get-Content $backing_store) -replace 'fn, internal::AllocationType::kOld', '[&](){ return fn(); }, internal::AllocationType::kOld' | Set-Content $backing_store
            Write-Host "✅ Patched backing-store.cc"
          }

      - name: Fix macOS SDK modulemaps
        if: runner.os == 'macOS'
        run: |
          SDK_PATH=$(xcrun --show-sdk-path)
          echo "SDK path: $SDK_PATH"
          INCLUDE_DIR="$SDK_PATH/usr/include"

          # V8/Chromium libc++ build compiles PCMs for _AvailabilityInternal module
          # from Darwin*.modulemap files. These exist in macOS 15+ SDK but NOT in 14.x.
          # Create stubs with correct module declaration so Clang can compile empty PCMs.
          CONTENT='module _AvailabilityInternal [system] [extern_c] {}'

          for name in DarwinBasic DarwinFoundation DarwinFoundation1 DarwinFoundation2 DarwinFoundation3 DarwinFoundation4 DarwinFoundation5 DarwinFoundation6 DarwinFoundation7 DarwinFoundation8 DarwinFoundation9 DarwinFoundation10; do
            f="$INCLUDE_DIR/$name.modulemap"
            if [ ! -f "$f" ]; then
              echo "Creating: $f"
              echo "$CONTENT" | sudo tee "$f" > /dev/null
            fi
          done

      - name: Configure Build
        working-directory: v8_build/v8
        shell: bash
        run: |
          BUILD_DIR="out.gn/${{ matrix.config.target_cpu }}.release"
          mkdir -p "$BUILD_DIR"

          # Base GN Args (shared across all platforms)
          cat > "$BUILD_DIR/args.gn" << GNEOF
          is_debug = false
          target_cpu = "${{ matrix.config.target_cpu }}"
          is_component_build = false
          v8_monolithic = true
          v8_use_external_startup_data = false
          is_clang = true
          use_custom_libcxx = true
          use_libcxx_modules = false
          v8_enable_pointer_compression = true
          v8_enable_sandbox = true
          symbol_level = 0
          v8_enable_v8_checks = false
          treat_warnings_as_errors = false
          v8_enable_web_assembly = true
          v8_enable_google_benchmark = false
          v8_enable_i18n_support = true
          clang_use_chrome_plugins = false
          enable_rust = false
          GNEOF

          # Platform-specific overrides
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "use_lld = true" >> "$BUILD_DIR/args.gn"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo 'mac_sdk_min = "14.0"' >> "$BUILD_DIR/args.gn"
          fi

          cat "$BUILD_DIR/args.gn"
          gn gen "$BUILD_DIR"

      - name: Fix remaining missing modulemaps
        if: runner.os == 'macOS'
        working-directory: v8_build/v8
        run: |
          BUILD_DIR="out.gn/${{ matrix.config.target_cpu }}.release"
          CONTENT='module _AvailabilityInternal [system] [extern_c] {}'

          # Scan build.ninja for any additional missing modulemap files
          grep -o "/[^ ]*\.modulemap" "$BUILD_DIR/build.ninja" | sort -u | while read f; do
            if [ ! -f "$f" ]; then
              echo "Creating scanned missing modulemap: $f"
              sudo mkdir -p "$(dirname "$f")"
              echo "$CONTENT" | sudo tee "$f" > /dev/null
            fi
          done

      - name: Build V8 Monolith
        working-directory: v8_build/v8
        run: ninja -C out.gn/${{ matrix.config.target_cpu }}.release v8_monolith

      - name: Upload V8 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v8_monolith_${{ matrix.config.name }}_${{ matrix.config.target_cpu }}
          path: |
            v8_build/v8/out.gn/${{ matrix.config.target_cpu }}.release/obj/v8_monolith.*
            v8_build/v8/out.gn/${{ matrix.config.target_cpu }}.release/icudtl.dat
            v8_build/v8/include
